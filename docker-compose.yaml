version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: postgres_dbagro2
    restart: always
    environment:
      POSTGRES_ROOT_PASSWORD: root
      POSTGRES_DB: db_agrosoft
      POSTGRES_USER: agrosoft
      POSTGRES_PASSWORD: agrosoft123
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - "3309:5432"